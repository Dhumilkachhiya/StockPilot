<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="sp-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sp-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="sp-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="sp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LOGO ICON (Geometric Inventory Cube + Dynamic Pilot Chevron) -->
  <g transform="translate(6, 4)" filter="url(#sp-glow)">
    <!-- Bottom Left Facet (Warehouse Tier) -->
    <path d="M4 22 L22 32 L22 42 L4 32 Z" fill="url(#sp-grad-dark)" opacity="0.9"/>
    <!-- Bottom Right Facet (Storage Node) -->
    <path d="M22 32 L40 22 L40 32 L22 42 Z" fill="#1E293B" opacity="0.75"/>
    <!-- Central Pilot Diamond / Stock Platform -->
    <path d="M22 4 L40 14 L22 24 L4 14 Z" fill="url(#sp-grad-primary)"/>
    <!-- Dynamic Pilot Arrow / Navigation Chevron -->
    <path d="M14 14 L22 9 L30 14 L22 19 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M22 9 L22 19" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Orbit Accent Pulse Dot -->
    <circle cx="22" cy="4" r="2.2" fill="#06B6D4"/>
  </g>

  <!-- WORDMARK: StockPilot -->
  <g transform="translate(56, 0)">
    <!-- "Stock" in Bold Dark Slate -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">Stock<tspan fill="url(#sp-grad-primary)">Pilot</tspan></text>
    
    <!-- Subtitle: INVENTORY INTELLIGENCE -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#64748B" letter-spacing="2.2px">INVENTORY SYSTEM</text>
  </g>
</svg>
